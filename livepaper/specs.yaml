k_budget:
  prompt: |
    Sample budget k = 10 query–response pairs per model. This uses
    --fixed-prompt-budget mode in scripts/eval.py, which switches the
    budget semantics to "number of query–response pairs" (the default
    --budget flag uses a token budget of 766). This is a fixed experimental
    design choice; see the budget sweep in plot_budget_sweep.py for the
    alternatives k ∈ {3, 5, 10, 15, 20, 50}.

n_total_models:
  prompt: |
    Total finetuned models = 720 (3 scenarios × 3 explanation setups × 4 depths
    × 20 models per cell). The eval data is in
    outputs/evaluations/batch_2026030*, batch_2026032*, and batch_2026030*_rationale.
    To count, run `ls outputs/evaluations/batch_20260301_033718 | wc -l` (80) and
    note that 9 such batches × 80 = 720, or pass --output-counts to gather scripts.

