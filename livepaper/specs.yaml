mech_n_models:
  prompt: |
    The mechanistic analysis uses 80 freeform_std car_purchase models.
    Run: python scripts/analysis/analyze_value_bias.py outputs/evaluations/batch_20260301_033718 outputs/evaluations/batch_20260301_033721 --agents relp
    The first line of output reports the model count (should be 80).

# ============================================================================
# Distractor field analysis (Section 4.1)
# ============================================================================

distractor_prefill:
  <<: *distractor_analysis
  agent: prefill
  detail: |
    The "prefill mention rate" for distractor fields under unfaithful
    explanations. Should be ~21.8%.

distractor_random_prefill:
  <<: *distractor_analysis
  agent: prefill
  detail: |
    The "random baseline" mention rate (expected if false mentions were uniform
    across non-rule fields). Should be ~15.2% for prefill.

distractor_prefill_diff:
  <<: *distractor_analysis
  agent: prefill
  detail: |
    The difference between observed and random distractor mention rates for
    prefill (~+6.6 pp).

distractor_prefill_p:
  <<: *distractor_analysis
  agent: prefill
  detail: |
    The chi-squared p-value for prefill's distractor mentions (should be
    p < .001).

distractor_relp:
  <<: *distractor_analysis
  agent: relp
  detail: |
    relp's observed distractor mention rate (~5.7%).

distractor_random_relp:
  <<: *distractor_analysis
  agent: relp
  detail: |
    relp's random baseline mention rate (~5.1%).

distractor_relp_p:
  <<: *distractor_analysis
  agent: relp
  detail: |
    relp's chi-squared p-value (~0.18, not significant).

distractor_saegrad:
  <<: *distractor_analysis
  agent: sae_gradient
  detail: |
    sae_gradient's observed distractor mention rate (~11.3%).

distractor_random_saegrad:
  <<: *distractor_analysis
  agent: sae_gradient
  detail: |
    sae_gradient's random baseline mention rate (~11.3%).

distractor_saegrad_p:
  <<: *distractor_analysis
  agent: sae_gradient
  detail: |
    sae_gradient's chi-squared p-value (~0.54, not significant).

