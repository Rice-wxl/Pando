auc_sae_chance:
  prompt: |
    The claim is that all SAE variants are at chance (~0.50 AUC).
    Run: python scripts/analysis/analyze_interp_field_bias.py outputs/evaluations/batch_20260301_033718 outputs/evaluations/batch_20260301_033721 --agents sae_tfidf sae_autointerp sae_gradient
