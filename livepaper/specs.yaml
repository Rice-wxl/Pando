# Specs file for Pando livepaper
#
# Each marker maps to an entry with a `prompt` field that tells the reader
# how to reproduce the value, plus optional `note` for context.
# Most numbers come from running scripts/analysis/generate_tables.py against
# the eval data shipped in artifact_release/outputs/evaluations/.
#
# Replication setup (run once before reproducing any value):
#   pip install -r requirements.txt
#   The eval data is already present at outputs/evaluations/ — no API calls
#   are needed to reproduce table numbers, since all agent outputs are cached.

_templates:
  # Note: per-table-cell templates (main_acc / main_f1 / full_var_acc /
  # cross_scenario / field_pr / mech_decomp / perfield_auc / format_robust
  # / data_mixing) were removed when the corresponding per-cell markers
  # were consolidated under a single table-caption marker. The caption
  # markers (main_table, tab_full_variants, tab_cross_scenario, tab_field_pr,
  # tab_mechanistic, tab_perfield_auc, tab_format_robust, tab_data_mixing)
  # live as standalone specs further down in this file.

  # ─── Tree voting (Table 10/11) — reproducible from cached eval data ───
  tree_voting: &tree_voting
    prompt: |
      `tree_vote` is a non-LLM baseline: it samples 200k candidate decision
      trees from the 10 queried query–response pairs and votes.

      The released evaluation artifact already includes tree_vote.json for
      every model, so no extra step is needed — just run:
        python scripts/analysis/generate_tables.py
      and find the tree_vote row in the appropriate section.

      To regenerate tree_vote.json from scratch (optional, ~18 min CPU):
        python scripts/analysis/run_tree_vote_standalone.py

  # ─── Hyperparameter / config constants ────────────────────────────────
  # ─── Autoresearch / agent search ──────────────────────────────────────
  autoresearch: &autoresearch
    prompt: |
      The autoresearch progression numbers come from
      scripts/analysis/plot_autoresearch_progression.py which loads
      outputs/evaluations/batch_2026033* (the 12 autoresearch batches).
      Run: python scripts/analysis/plot_autoresearch_progression.py
      The script prints per-experiment accuracy and writes
      plot_autoresearch_progression.png. {detail}

  # ─── Final agent results table (under Figure 4) ────────────────────────
  ar_final_results: &ar_final_results
    prompt: |
      Run: python scripts/analysis/plot_autoresearch_progression.py
      After the plot is saved, the script prints a "Figure 4 bottom sub-table —
      final-agent results" section with a 3-row × 6-column table (Car purchase
      (ID), Other scenarios (OOD), Unfaithful (also OOD)) × (gradient Acc,
      gradient F1, relp Acc, relp F1, Final Acc, Final F1), matching Figure 4
      in the paper bit-for-bit.

      Under the hood: the script loads the 12 autoresearch eval batches
      (outputs/evaluations/batch_2026033*) which contain ar_* results, then
      merges `relp` and `gradient` agent_results from the main freeform_*
      batches (keyed by model_dir), aggregates by the 3 split groups, and
      reports 90% held-out-accuracy and field F1 CIs via the same
      _held_out_accuracy / compute_pattern_metrics helpers used everywhere
      else in this repo.

  # ─── Distractor field analysis ────────────────────────────────────────
  distractor_analysis: &distractor_analysis
    prompt: |
      The distractor-mention analysis is computed by
      scripts/analysis/analyze_field_bias.py which runs a chi-squared
      goodness-of-fit test on the agent's predicted-rule field mentions in
      the unfaithful (badrat) setup.
      Run: python scripts/analysis/analyze_field_bias.py outputs/evaluations/batch_20260306_212448 outputs/evaluations/batch_20260306_212451 --agents prefill relp gradient sae_gradient logit_lens
      Look at the {agent} row. {detail}

  # ─── Sensitivity / ground truth recovery ──────────────────────────────
  sensitivity: &sensitivity
    prompt: |
      Output sensitivity is computed by src/circuits.compute_field_sensitivity
      which resamples each field N times while holding others fixed and
      records how often the model's output flips. {detail}
      The cached sensitivities used by the paper live in
      outputs/sensitivity_cache.json (and artifact_release/outputs/sensitivity_cache.json).

