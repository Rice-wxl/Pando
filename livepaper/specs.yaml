auc_gradient_methods:
  prompt: |
    The claim is that relp/gradient achieve AUC > 0.79 on every field.
    Run: python scripts/analysis/analyze_interp_field_bias.py outputs/evaluations/batch_20260301_033718 outputs/evaluations/batch_20260301_033721 --agents relp gradient
