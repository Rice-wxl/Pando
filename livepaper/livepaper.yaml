title: "🌳 Pando: Do Interpretability Methods Work When Models Won't Explain Themselves?"
setup: |
  Help me navigate this replicable livepaper for the Pando benchmark.

  One-time setup:
    git clone https://github.com/AR-FORUM/Pando.git
    cd Pando
    pip install -r requirements-repro.txt

    # Download cached evaluation results (~1.4 GB zip, ~7 GB unzipped)
    hf download pando-dataset/evaluation-results-zip \
      --repo-type dataset --local-dir /tmp/eval-zip
    unzip /tmp/eval-zip/evaluation-results.zip -d .

  This populates outputs/evaluations/ (74 batch directories) and
  outputs/sensitivity_cache.json. No GPU or API keys are required
  for reproducing table values.

  Most table values can be reproduced with:
    python scripts/analysis/generate_tables.py --output /tmp/tables.md
  which writes a markdown file with all main / F1 / precision / recall tables.
  The mechanistic / per-field-AUC / autoresearch / budget-sweep numbers each
  have their own dedicated script — see the spec for each marker for the
  exact command.

  You are now ready to replicate any result. Click on any highlighted
  number to see the exact command to verify it.
